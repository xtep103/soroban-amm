[package]
name = "soroban_amm_simulator"
version = "0.1.0"
edition = "2021"
description = "Off-chain simulation engine and CLI for Soroban AMM strategies"
license = "MIT"
repository = "https://github.com/promisszn/soroban-amm"
keywords = ["soroban", "stellar", "amm", "simulation", "backtesting"]
categories = ["finance"]
readme = "README.md"

[lib]
name = "soroban_amm_simulator"

[[bin]]
name = "amm_sim"
path = "src/bin/amm-sim.rs"

[dependencies]
clap = { version = "4.5.20", features = ["derive"] }
csv = "1.3"
# `SmallRng` is documented as non-portable and platform-dependent
# (Xoshiro256 on 64-bit, Xoshiro128 on 32-bit), so seeded runs were not
# reproducible across machines. PCG is fixed-algorithm and portable,
# which is what rand's own docs point to for reproducible output.
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_pcg = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# `tests/cl_swap_parity.rs` runs the real contract next to the simulator.
concentrated_liquidity = { path = "../../contracts/concentrated_liquidity", features = ["testutils"] }
amm = { path = "../../contracts/amm", features = ["testutils"] }
token = { path = "../../contracts/token", features = ["testutils"] }
soroban-sdk = { workspace = true, features = ["testutils"] }
