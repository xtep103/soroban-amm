name: Release contracts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish contract artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `Update changelog` walks the tag history to build the release notes,
          # so the default depth-1 checkout is not enough.
          fetch-depth: 0
      # Channel and target come from rust-toolchain.toml, so a release is built
      # with the same toolchain CI tested the commit on.
      - name: Setup Rust
        run: rustup show
      # The list of crates excluded from the wasm build lives in
      # scripts/build_workspace.sh, which is shared with .github/workflows/ci.yml
      # and the Makefile. Change the exclusions there, not here.
      - name: Build contracts
        run: bash scripts/build_workspace.sh
      # Report-only: unoptimized artifacts are reliably larger than what
      # actually gets deployed (`stellar contract optimize` strips ~15-20%
      # on a contract like concentrated_liquidity), so failing the release on
      # this number would reject contracts that fit comfortably once
      # optimized. The real enforcement is the optimized-artifact check below.
      - name: Check contract sizes (unoptimized)
        run: bash scripts/size_report.sh
      # Same version as the Dockerfile, README.md and smoke-test.yml, installed
      # the same way smoke-test.yml does. Building it with `cargo install`
      # here compiled the CLI under rust-toolchain.toml, where the 23.0.0 pin
      # locked an ethnum that no longer compiles (1.5.0), and needs system
      # headers (libdbus, libudev) the runner is not guaranteed to have.
      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v27.1.0
      - name: Optimize WASM artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          while IFS= read -r wasm; do
            name=$(basename "$wasm")
            stellar contract optimize --wasm "$wasm" --wasm-out "release-artifacts/$name"
          done < <(find target/wasm32v1-none/release -maxdepth 1 -name '*.wasm' -type f | sort)
      - name: Check contract sizes (optimized, network cap)
        run: WASM_DIR=release-artifacts bash scripts/size_report.sh --fail-on-limit
      - name: Generate checksums
        working-directory: release-artifacts
        run: sha256sum *.wasm > sha256sums.txt
      - name: Update changelog
        shell: bash
        run: |
          set -euo pipefail
          previous=$(git tag --sort=-creatordate | sed -n '2p' || true)
          range="${previous:+$previous..}HEAD"
          {
            echo "## ${GITHUB_REF_NAME} (${GITHUB_SHA:0:12})"
            git log --pretty='- %s' $range
            echo
            cat CHANGELOG.md 2>/dev/null || true
          } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: release-artifacts/*
