name: CI
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
jobs:
    build-and-test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Check repository hygiene
              run: |
                  bash scripts/check_repo_hygiene.sh tracked
                  bash scripts/check_repo_hygiene.test.sh
                  bash scripts/check_staking_deploy.test.sh
            # Channel, components and targets all come from
            # rust-toolchain.toml, so CI cannot drift onto a newer stable than
            # contributors are running; `rustup show` installs what it asks
            # for. This also drops the unmaintained actions-rs/toolchain,
            # which pinned every run to the deprecated Node 20 runtime.
            - name: Setup Rust
              run: rustup show
            - name: Cache Cargo dependencies
              uses: Swatinem/rust-cache@v2
            # `router`, `dex-aggregator`, `batch_router`, and `batch_auction` used to
            # depend on more than one other contract crate (e.g. `amm` + `factory`,
            # or `amm` + `concentrated_liquidity`) as a Rust library, which caused a
            # duplicate wasm-export symbol collision at link time (every
            # #[contractimpl] fn in a dependency is exported as a wasm symbol).
            # Fixed by extracting the cross-contract call interfaces those four
            # crates actually need into `contracts/pool_interfaces`, a shared crate
            # with no `#[contract]`/`#[contractimpl]` block and therefore no wasm
            # exports of its own. All four now depend on that instead of on the
            # real contract crates (which remain dev-dependencies for their own
            # tests), so there is nothing left to collide with at link time.
            # Which crates are excluded from the wasm build is decided in
            # scripts/build_workspace.sh, shared with release.yml and the
            # Makefile so the three cannot drift apart. Change exclusions there.
            - name: Build WASM artifacts
              run: bash scripts/build_workspace.sh
            # Report-only: unoptimized artifacts are reliably larger than what
            # actually gets deployed (`stellar contract optimize` strips ~15-20%
            # on a contract like concentrated_liquidity), so failing the build on
            # this number would reject contracts that fit comfortably once
            # optimized. The real enforcement is the optimized-artifact check below.
            - name: Check WASM binary sizes (network cap, unoptimized)
              run: bash scripts/size_report.sh
            # Same prebuilt-binary install release.yml and smoke-test.yml use —
            # fast, and does not need this job's compiler to match the CLI's
            # locked dependency tree the way `cargo install` would.
            - name: Install Stellar CLI
              uses: stellar/stellar-cli@v27.1.0
            - name: Check committed ABI against contract interfaces
              run: make check-abi
            - name: Test ABI generator and checker
              run: make test-abi
            - name: Optimize WASM artifacts
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p target/wasm32v1-none/release/optimized
                  while IFS= read -r wasm; do
                      name=$(basename "$wasm")
                      stellar contract optimize --wasm "$wasm" --wasm-out "target/wasm32v1-none/release/optimized/$name"
                  done < <(find target/wasm32v1-none/release -maxdepth 1 -name '*.wasm' -type f | sort)
            - name: Check WASM binary sizes (network cap, optimized)
              run: bash scripts/size_report.sh --fail-on-limit --optimized
            # All six crates that were previously excluded here
            # (`concentrated_liquidity`, `dex-aggregator`, `incentive-campaigns`,
            # `oracle-aggregator`, `token`, `v2-to-v3-migration`) have had their
            # pre-existing test failures root-caused and fixed. Three deep,
            # non-trivial bugs found along the way in `concentrated_liquidity`
            # (tick-crossing liquidity/fee-growth bookkeeping) are documented and
            # left as `#[ignore]`d tests with a diagnosis in the test file itself,
            # rather than excluding the whole crate — see that PR's description
            # for details. Every crate in the workspace now runs on every PR.
            - name: Run all tests
              run: cargo test --workspace --exclude amm_fuzz
            - name: Run upgrade integration tests
              run: cargo test -p integration_tests upgrade
            - name: Run hot-path benchmarks
              run: cargo run -p benches -- --check
            - name: Clippy
              run: cargo clippy --workspace --all-targets --exclude amm_fuzz -- -D warnings
            - name: Format check
              run: cargo fmt --all -- --check
            - name: Check docs
              run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --exclude amm_fuzz
            - name: Check error docs sync
              run: make check-docs
            - name: Check storage keys do not depend on the ledger clock
              run: make check-storage-keys
            # Every deployable workspace contract must have a scripts/deploy/
            # module that scripts/deploy.sh actually runs (issue #959).
            - name: Check deploy scripts cover every contract
              run: make check-deploy-scripts

            - name: Security audit
              uses: rustsec/audit-check@v2
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
              # Advisories can be ignored via .cargo/audit.toml.
            - name: Check tests and build left a clean working tree
              if: always()
              run: bash scripts/check_repo_hygiene.sh clean

    fuzz:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # Channel, components and targets all come from
            # rust-toolchain.toml, so CI cannot drift onto a newer stable than
            # contributors are running; `rustup show` installs what it asks
            # for. This also drops the unmaintained actions-rs/toolchain,
            # which pinned every run to the deprecated Node 20 runtime.
            - name: Setup Rust
              run: rustup show
            - name: Cache Cargo dependencies
              uses: Swatinem/rust-cache@v2
            - name: Run the full amm-fuzz suite (incl. CL stateful properties)
              run: make fuzz-cl

    go-sdk:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: packages/go-sdk
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: "1.21"
                  # The SDK has no third-party dependencies, so there is no go.sum to
                  # key a module cache on.
                  cache: false
            - name: Setup Node for reference vectors
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
            - name: Check ScVal vectors against Stellar SDK
              run: |
                  npm ci --ignore-scripts --prefix ../../services/graphql-api
                  node testdata/gen.mjs
                  git diff --exit-code -- testdata/scval_vectors.json
            - name: Format check
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                    echo "FAIL: gofmt found unformatted files:"
                    echo "$unformatted"
                    exit 1
                  fi
            - name: Build
              run: go build ./...
            - name: Vet
              run: go vet ./...
            - name: Test
              run: go test ./... -count=1

    # Every JS package must type-check against the Node major CI runs on, and
    # declare it in engines.node. .nvmrc is the single source of truth; the
    # npm-packages job below reads it too (#983).
    node-versions:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
            - name: Check @types/node and engines.node match .nvmrc
              run: node scripts/check_node_versions.mjs

    # The webhook-streamer names event fields from event-schemas.json. Fail
    # when a contract emit site and that file disagree, or when the generated
    # docs catalogue is stale (#1124).
    event-schemas:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
            - name: Check event schemas against contract emit sites
              run: node scripts/check_event_schemas.mjs
            - name: Test the event schema checker
              run: node --test scripts/check_event_schemas.test.mjs

    npm-packages:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - dir: packages/sdk
                      test_cmd: npm test -- --passWithNoTests
                    - dir: packages/ui-components
                      # Run the real test suite (now that it exists) and enforce the
                      # configured coverage thresholds; a broken component or a drop
                      # below the line/function coverage floor fails the build.
                      test_cmd: npm test -- --coverage
                    - dir: packages/ts-advanced-client
                      test_cmd: npm test
                    - dir: services/graphql-api
                      test_cmd: npm test
                    - dir: services/webhook-streamer
                      test_cmd: npm test
                    - dir: services/health-dashboard
                      test_cmd: npm test
                    - dir: examples/client
                      test_cmd: npm test
        defaults:
            run:
                working-directory: ${{ matrix.dir }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
            # `npm ci` installs exactly what each workspace's package-lock.json
            # pins and errors when the lockfile and package.json disagree, so a
            # transitive dependency publishing between two runs can no longer
            # turn CI red on an unchanged tree — the same guarantee
            # rust-toolchain.toml gives the Rust jobs above. Every workspace
            # now commits a lockfile, so there is always something to install
            # from; regenerating one requires an explicit `npm install` in that
            # workspace, which keeps lockfile changes visible in review.
            # The shared ESLint config (eslint.config.mjs) and its toolchain
            # live at the repo root. npm puts every ancestor's
            # node_modules/.bin on PATH, so each workspace's `npm run lint`
            # picks up this one install.
            - name: Install lint tooling
              working-directory: .
              run: npm ci
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build
            # Runs after Build because type-aware rules need resolvable
            # imports (examples/client resolves @soroban-amm/sdk from the SDK
            # its prebuild step compiles). Any lint error fails the job, the
            # same as clippy's -D warnings on the Rust side.
            - name: Lint
              run: npm run lint
            - name: Test
              run: ${{ matrix.test_cmd }}

    docker-build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # Build the image from the Dockerfile at the repo root and run
            # `make build` inside it.  This job is the CI gate that prevents
            # the container from silently diverging from the rest of the repo:
            # if the wrong target, a stale base image, or a broken manifest
            # copy sneaks back in, this step will fail before it merges.
            - name: Build Docker image
              run: docker build -t soroban-amm-build .
            - name: Run make build inside container
              run: |
                docker run --rm \
                  -v "${{ github.workspace }}":/app \
                  -w /app \
                  soroban-amm-build \
                  make build

    python-examples:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: examples/python
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"
            - name: Install dependencies
              run: pip install -r requirements.txt -r requirements-dev.txt
            - name: Run tests
              run: pytest -q
            - name: Type check (mypy)
              run: mypy .
            - name: Lint (ruff)
              run: ruff check .
